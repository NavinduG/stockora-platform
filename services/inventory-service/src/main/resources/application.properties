spring.application.name=inventory-service

# Database connection - values come from environment variables (see below)
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.xdjwfkxljaokawrpseje
spring.datasource.password=#ngmg@stockora@26SE99

# Let Hibernate auto-create tables based on our Java entities (fine for dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator - expose health/metrics endpoints (for monitoring later)
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# RabbitMQ connection
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=5671
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=true

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

jwt.secret=${JWT_SECRET}