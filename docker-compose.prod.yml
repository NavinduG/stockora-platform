services:
  inventory-service:
    image: navindug/stockora-inventory-service:latest
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${INVENTORY_DB_HOST}
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: ${INVENTORY_DB_USER}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx200m"
    restart: unless-stopped
    mem_limit: 300m

  order-service:
    image: navindug/stockora-order-service:latest
    ports:
      - "8081:8081"
    environment:
      DB_HOST: ${ORDER_DB_HOST}
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: ${ORDER_DB_USER}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      JAVA_TOOL_OPTIONS: "-Xmx200m"
    restart: unless-stopped
    mem_limit: 300m
    depends_on:
      - inventory-service

  notification-service:
    image: navindug/stockora-notification-service:latest
    ports:
      - "8082:8082"
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      JAVA_TOOL_OPTIONS: "-Xmx150m"
    restart: unless-stopped
    mem_limit: 250m

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    mem_limit: 150m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    mem_limit: 150m
    restart: unless-stopped
    depends_on:
      - prometheus